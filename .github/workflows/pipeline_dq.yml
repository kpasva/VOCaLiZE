name: Pipeline DQ on PRs
on:
  pull_request:
    branches: [ "**" ]
    paths:
      - 'spark_pipelines/**'
      - 'dq_check.py'
jobs:
  dq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Detect pipeline folder
        id: detect
        run: |
          echo "pipeline=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '^spark_pipelines/.*/' | cut -d'/' -f2 | head -1)" >> $GITHUB_OUTPUT
      - name: Run DQ
        run: |
          python dq_check.py --pipeline "${{ steps.detect.outputs.pipeline }}" || echo "DQ ran with defaults"
      - name: Comment results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'DQ results (CI): ';
            try { body += fs.readFileSync('dq_report_ci.txt','utf8'); } catch(e) { body += 'No report generated.' }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })